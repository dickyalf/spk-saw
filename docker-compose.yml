version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/spk_saw
      JWT_SECRET: change_me_to_secure_random
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - '5000:5000'
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - '5173:5173'

volumes:
  mongo-data:
